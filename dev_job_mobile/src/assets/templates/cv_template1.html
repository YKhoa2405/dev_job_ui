<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ddd;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #2c3e50;
        }
        .header {
            text-align: center;
        }
        .contact-info {
            text-align: center;
            margin-bottom: 20px;
        }
        .section {
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 20px;
            font-weight: bold;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }
        ul {
            list-style-type: disc;
            padding-left: 20px;
        }
        ul li {
            margin-bottom: 10px;
        }
        .project-link {
            color: #2c3e50;
            text-decoration: none;
        }
        .project-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>{{fullName}}</h1>
        <p>{{position}}</p>
    </div>

    <div class="contact-info">
        <p>{{dateOfBirth}} | {{phone}} | <a href="mailto:{{email}}">{{email}}</a></p>
        <p>{{location}} | <a href="{{githubLink}}">{{githubLink}}</a></p>
    </div>

    <div class="section">
        <div class="section-title">EDUCATION</div>
        {{educations}}
    </div>

    <div class="section">
        <div class="section-title">WORK EXPERIENCE</div>
        {{experiences}}
    </div>

    <div class="section">
        <div class="section-title">PROJECTS</div>
        <ul>
            {{projects}}
        </ul>
    </div>

    <div class="section">
        <div class="section-title">SKILLS</div>
        <ul>
            {{skills}}
        </ul>
    </div>
</body>
</html>
